name: Release Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd bismillah-panel
          npm install

      - name: Build Tauri App
        run: |
          cd bismillah-panel
          npm run tauri build

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: shawapump-installer-msi
          path: bismillah-panel/src-tauri/target/release/bundle/msi/*.msi
