[package]
name = "bismillah-panel"
version = "1.0.0"
description = "Panel de control para Bismillah Bot"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "bismillah-panel"
path = "src/main.rs"
