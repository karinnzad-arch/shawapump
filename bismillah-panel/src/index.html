<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bismillah Control Panel</title>
<style>
  :root {
    --bg: #0b0f19; --panel: #111827; --border: #1f2937;
    --text: #d1d5db; --text-dim: #6b7280; --accent: #10b981;
    --danger: #f43f5e; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, sans-serif; font-size: 13px;
    display: flex; height: 100vh; overflow: hidden;
  }
  #setup-screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  #setup-screen.hidden { display: none; }
  .setup-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 32px; width: 480px; }
  .setup-box h2 { margin-top: 0; }
  .setup-row { margin-bottom: 16px; }
  .setup-row label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 12px; }
  .path-picker { display: flex; gap: 8px; }
  .path-picker input { flex: 1; }

  #sidebar {
    width: 220px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 12px 0; overflow-y: auto;
  }
  .tab-btn {
    background: none; border: none; color: var(--text-dim); text-align: left;
    padding: 10px 20px; cursor: pointer; font-size: 13px; font-family: monospace;
  }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .tab-btn.active { color: var(--accent); background: rgba(16,185,129,0.08); border-left: 2px solid var(--accent); }

  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #status-pill { display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  .dot.running { background: var(--accent); }
  #topbar-actions button { margin-left: 8px; }
  #mode-badge {
    font-family: monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    padding: 4px 10px; border-radius: 4px; text-transform: uppercase;
  }
  #mode-badge.paper { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.35); }
  #mode-badge.real { background: rgba(244,63,94,0.12); color: var(--danger); border: 1px solid rgba(244,63,94,0.4); }
  #mode-badge.unknown { background: rgba(107,114,128,0.12); color: var(--text-dim); border: 1px solid var(--border); }

  #content { flex: 1; overflow-y: auto; padding: 24px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; font-family: monospace; }
  .field input {
    width: 100%; background: #0b0f19; border: 1px solid var(--border); border-radius: 4px;
    padding: 7px 8px; color: var(--text); font-family: monospace; font-size: 12px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field.full { grid-column: 1 / -1; }
  .field .help { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .warn-box {
    background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3);
    border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; font-size: 12px; color: var(--warn);
  }

  button {
    background: #1f2937; border: 1px solid #374151; color: var(--text);
    border-radius: 4px; padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: monospace;
  }
  button:hover { background: #374151; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  button.primary:hover { background: #0da271; }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #save-bar {
    display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #save-feedback { align-self: center; font-size: 12px; color: var(--accent); margin-right: auto; }

  /* ---- Consola en vivo ---- */
  #terminal-panel { display: flex; flex-direction: column; }
  #terminal-banner {
    font-family: monospace; font-weight: 700; font-size: 20px; letter-spacing: 6px;
    color: var(--accent); text-shadow: 0 0 8px rgba(16,185,129,0.5);
    padding: 10px 4px 16px; border-bottom: 1px dashed var(--border); margin-bottom: 10px;
  }
  #terminal-banner span { color: #e5e7eb; text-shadow: none; }
  #terminal-toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  #terminal-output {
    background: #000; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; overflow-y: auto; font-family: "Consolas", monospace; font-size: 12px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    height: 62vh;
  }
  #terminal-output .line { color: #e5e7eb; }
  #terminal-output .line.stderr { color: #f87171; }
  #terminal-output .placeholder { color: var(--text-dim); font-style: italic; }
</style>
</head>
<body>

  <!-- Pantalla de primer uso: elegir el .exe del bot y el .env -->
  <div id="setup-screen">
    <div class="setup-box">
      <h2>Configuración inicial</h2>
      <p style="color:var(--text-dim); font-size:12px;">Elegí una sola vez dónde están tu bot y tu archivo .env. Esto queda guardado localmente en tu PC.</p>
      <div class="setup-row">
        <label>Archivo del bot (bismillah_bot.exe)</label>
        <div class="path-picker">
          <input type="text" id="setup-bot-path" readonly placeholder="Sin seleccionar...">
          <button onclick="pickBotExe()">Elegir...</button>
        </div>
      </div>
      <div class="setup-row">
        <label>Archivo .env</label>
        <div class="path-picker">
          <input type="text" id="setup-env-path" readonly placeholder="Sin seleccionar...">
          <button onclick="pickEnvFile()">Elegir...</button>
        </div>
      </div>
      <button class="primary" style="width:100%; padding:10px;" onclick="finishSetup()">Continuar</button>
    </div>
  </div>

  <div id="sidebar"></div>

  <div id="main">
    <div id="topbar">
      <div id="status-pill">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Bot detenido</span>
        <span id="mode-badge" class="unknown">—</span>
      </div>
      <div id="topbar-actions">
        <button onclick="startBot()">Iniciar</button>
        <button onclick="stopBot()">Detener</button>
        <button onclick="restartBot()">Reiniciar</button>
        <button onclick="openSetup()">⚙ Rutas</button>
      </div>
    </div>
    <div id="content"></div>
    <div id="save-bar">
      <span id="save-feedback"></span>
      <button class="primary" onclick="saveAll()">Guardar y reiniciar bot</button>
    </div>
  </div>

<script>
const { invoke } = window.__TAURI__.core;
const { open } = window.__TAURI__.dialog;
const { listen } = window.__TAURI__.event;

// ===================================================================
// Esquema: cada pestaña y sus campos, mapeado 1:1 a las variables
// reales de tu .env. "help" es el texto que aparece como ayuda corta
// debajo de cada campo — esto reemplaza al manual en PDF.
// ===================================================================
const SCHEMA = [
  { tab: "General", fields: [
    { key: "PAPER_TRADING", label: "Paper trading", help: "true = simulado, false = plata real" },
    { key: "FEED_ADAPTER", label: "Feed adapter", help: "Qué formato de feed usar (websocket/triton)" },
    { key: "WS_ENDPOINT", label: "WebSocket endpoint", restart: true },
    { key: "RPC_ENDPOINT", label: "RPC endpoint", restart: true },
    { key: "RELAY_ENDPOINTS", label: "Relay endpoints", restart: true },
    { key: "SHARD_MAX_SUBS", label: "Shard max subs" },
  ]},
  { tab: "Wallet", fields: [
    { key: "WALLET_PRIVATE_KEY", label: "Wallet private key", password: true,
      help: "⚠️ Nunca compartas este valor. Se guarda solo en tu .env local." },
    { key: "PAPER_INITIAL_BALANCE", label: "Balance inicial (paper)" },
  ]},
  { tab: "Triton Stream", fields: [
    { key: "TRITON_STREAM_ENABLED", label: "Habilitado (true/false)" },
    { key: "TRITON_GRPC_ENDPOINT", label: "Endpoint gRPC", restart: true },
    { key: "TRITON_X_TOKEN", label: "Token (API key)", password: true, restart: true },
  ]},
  { tab: "Rug Agent", fields: [
    { key: "RUG_AGENT_ENABLED", label: "Habilitado (true/false)" },
    { key: "VERTEX_API_KEY", label: "Vertex API key", password: true },
    { key: "VERTEX_MODEL", label: "Modelo de Vertex" },
  ]},
  { tab: "Capital / Fees", fields: [
    { key: "PER_TRADE_SOL", label: "SOL por trade" },
    { key: "MAX_POSITIONS", label: "Posiciones máximas simultáneas" },
    { key: "FEE_BPS", label: "Fee (basis points)" },
    { key: "SLIPPAGE_BUY", label: "Slippage compra (%)" },
    { key: "SLIPPAGE_SELL", label: "Slippage venta (%)" },
    { key: "PRIORITY_FEE", label: "Priority fee (SOL)" },
    { key: "USE_SENDER", label: "Usar sender (true/false)" },
    { key: "SENDER_TIP_SOL", label: "Tip del sender (SOL)" },
  ]},
  { tab: "Filtros L1", fields: [
    { key: "FILTER_MAX_DEV_SUPPLY_PCT", label: "Máx. % supply del dev" },
    { key: "FILTER_MIN_INITIAL_MC_SOL", label: "Mín. market cap inicial (SOL)" },
    { key: "FILTER_MAX_INITIAL_MC_SOL", label: "Máx. market cap inicial (SOL)" },
    { key: "FILTER_MIN_INITIAL_LIQ_SOL", label: "Mín. liquidez inicial (SOL)" },
    { key: "FILTER_DEV_WALLET_BLACKLIST", label: "Blacklist de dev wallets", full: true },
    { key: "FILTER_NAME_BLACKLIST", label: "Blacklist de nombres", full: true },
  ]},
  { tab: "Filtros L2", fields: [
    { key: "FILTER_MIN_BUY_RATIO", label: "Mín. buy ratio" },
    { key: "FILTER_MAX_BUY_RATIO", label: "Máx. buy ratio" },
    { key: "FILTER_MIN_VOLUME_SOL", label: "Mín. volumen (SOL)" },
    { key: "FILTER_MIN_UNIQUE_TRADERS", label: "Mín. traders únicos" },
    { key: "FILTER_MIN_MARKET_CAP_SOL", label: "Mín. market cap (SOL)" },
    { key: "FILTER_MAX_MARKET_CAP_SOL", label: "Máx. market cap (SOL)" },
    { key: "FILTER_MIN_LIQUIDITY_SOL", label: "Mín. liquidez (SOL)" },
    { key: "FILTER_MAX_LIQUIDITY_SOL", label: "Máx. liquidez (SOL)" },
    { key: "FILTER_MAX_BUY_SPEED_SOL_PER_SEC", label: "Máx. velocidad de compra (SOL/s)" },
    { key: "FILTER_MAX_SELL_COUNT", label: "Máx. cantidad de ventas" },
    { key: "FILTER_MIN_UNIQUE_TRADER_RATIO", label: "Mín. ratio traders únicos" },
    { key: "FILTER_MAX_SELL_BUY_RATIO", label: "Máx. ratio venta/compra" },
  ]},
  { tab: "Filtros confirmados", fields: [
    { key: "FILTER_MIN_CURVE_FILL_PCT_ENTRY", label: "Mín. curve fill % (entrada)" },
    { key: "FILTER_MAX_CURVE_FILL_PCT_ENTRY", label: "Máx. curve fill % (entrada)" },
    { key: "FILTER_MAX_TRADES_TO_50PCT_CURVE", label: "Máx. trades hasta 50% curva" },
    { key: "FILTER_MIN_UNIQUE_WALLETS", label: "Mín. wallets únicas" },
    { key: "FILTER_MAX_V_TOKENS_BONDING_CURVE", label: "Máx. tokens en bonding curve" },
    { key: "FILTER_MIN_AVG_TRADE_SIZE_SOL", label: "Mín. tamaño prom. de trade (SOL)" },
    { key: "FILTER_MAX_AVG_TRADE_SIZE_SOL", label: "Máx. tamaño prom. de trade (SOL)" },
    { key: "FILTER_MIN_GAP_MAX_SECONDS", label: "Mín. gap máximo (segundos)" },
  ]},
  { tab: "Modelo ML", fields: [
    { key: "MODEL_ENABLED", label: "Modelo habilitado (true/false)" },
    { key: "FEATURE_EXTRACTION_SECOND", label: "Segundo de extracción de features" },
    { key: "FEATURE_EXTRACTION_MARGIN_SECS", label: "Margen de extracción (segundos)" },
    { key: "MODEL_ENTRADA_PATH", label: "Path modelo de entrada" },
    { key: "MODEL_MIGRACION_PATH", label: "Path modelo de migración" },
    { key: "MODEL_SALIDA_PATH", label: "Path modelo de salida" },
    { key: "MODEL_MIN_SCORE", label: "Score mínimo (entrada)" },
    { key: "MODEL_MIGRATION_MIN_SCORE", label: "Score mínimo (migración)" },
    { key: "MODEL_SALIDA_MIN_SCORE", label: "Score mínimo (salida)" },
  ]},
  { tab: "Salida", fields: [
    { key: "EXIT_MAX_DRAWDOWN_PCT", label: "Máx. drawdown de salida (%)" },
    { key: "EXIT_TIMEOUT_SECS", label: "Timeout de salida (segundos)" },
    { key: "EXIT_MIGRATION_EXTENSION_SECS", label: "Extensión por migración (segundos)" },
  ]},
  { tab: "Telegram", fields: [
    { key: "TELEGRAM_TOKEN", label: "Token del bot", password: true },
    { key: "TELEGRAM_CHAT_ID", label: "Chat ID" },
  ]},
  { tab: "Misc", fields: [
    { key: "TICK_INTERVAL_SECONDS", label: "Intervalo de tick (segundos)" },
    { key: "MIGRATION_WINDOW_SECONDS", label: "Ventana de migración (segundos)" },
    { key: "CLOSE_ON_DISCONNECT", label: "Cerrar al desconectar (true/false)" },
    { key: "MAX_SESSION_DRAWDOWN_PCT", label: "Máx. drawdown de sesión (%)" },
  ]},
];

let settings = { bot_exe_path: null, env_path: null };
let envValues = {};
let statusInterval = null;
const MAX_TERMINAL_LINES = 3000;

function appendTerminalLine(stream, text) {
  const out = document.getElementById("terminal-output");
  if (!out) return; // el tab de Terminal todavía no se construyó
  const placeholder = out.querySelector(".placeholder");
  if (placeholder) placeholder.remove();

  const wasAtBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;

  const span = document.createElement("div");
  span.className = "line" + (stream === "stderr" ? " stderr" : "");
  span.textContent = text;
  out.appendChild(span);

  while (out.childElementCount > MAX_TERMINAL_LINES) {
    out.removeChild(out.firstChild);
  }
  if (wasAtBottom) out.scrollTop = out.scrollHeight;
}

function clearTerminal() {
  const out = document.getElementById("terminal-output");
  if (out) out.innerHTML = '<span class="placeholder">Consola limpiada.</span>';
}

listen("bot-log", (event) => {
  appendTerminalLine(event.payload.stream, event.payload.line);
});

async function init() {
  settings = await invoke("load_settings");
  if (settings.bot_exe_path && settings.env_path) {
    document.getElementById("setup-screen").classList.add("hidden");
    await loadEnv();
    buildUI();
    startStatusPolling();
  }
}

function openSetup() {
  document.getElementById("setup-bot-path").value = settings.bot_exe_path || "";
  document.getElementById("setup-env-path").value = settings.env_path || "";
  document.getElementById("setup-screen").classList.remove("hidden");
}

async function pickBotExe() {
  const file = await open({ multiple: false, filters: [{ name: "Ejecutable", extensions: ["exe"] }] });
  if (file) document.getElementById("setup-bot-path").value = file;
}

async function pickEnvFile() {
  const file = await open({ multiple: false, filters: [{ name: "Archivo .env", extensions: ["env", "*"] }] });
  if (file) document.getElementById("setup-env-path").value = file;
}

async function finishSetup() {
  const botPath = document.getElementById("setup-bot-path").value;
  const envPath = document.getElementById("setup-env-path").value;
  if (!botPath || !envPath) { alert("Elegí ambos archivos antes de continuar."); return; }
  settings = { bot_exe_path: botPath, env_path: envPath };
  await invoke("save_settings", { settings });
  document.getElementById("setup-screen").classList.add("hidden");
  await loadEnv();
  buildUI();
  startStatusPolling();
}

async function loadEnv() {
  envValues = await invoke("read_env_file", { path: settings.env_path });
  updateModeBadge(envValues.PAPER_TRADING);
}

function updateModeBadge(rawValue) {
  const badge = document.getElementById("mode-badge");
  const val = (rawValue || "").trim().toLowerCase();
  badge.classList.remove("paper", "real", "unknown");
  if (val === "true") {
    badge.textContent = "PAPER";
    badge.classList.add("paper");
  } else if (val === "false") {
    badge.textContent = "PLATA REAL";
    badge.classList.add("real");
  } else {
    badge.textContent = "PAPER_TRADING no seteado";
    badge.classList.add("unknown");
  }
}

function buildUI() {
  const sidebar = document.getElementById("sidebar");
  const content = document.getElementById("content");
  sidebar.innerHTML = "";
  content.innerHTML = "";

  SCHEMA.forEach((section, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i === 0 ? " active" : "");
    btn.textContent = "[ " + section.tab + " ]";
    btn.onclick = () => selectTab(i);
    btn.dataset.tabIndex = i;
    sidebar.appendChild(btn);
    const panel = document.createElement("div");
    panel.className = "tab-panel" + (i === 0 ? " active" : "");
    panel.id = "panel-" + i;

    if (section.tab === "Wallet") {
      const warn = document.createElement("div");
      warn.className = "warn-box";
      warn.textContent = "Estos valores viven solo en tu .env local. Esta app nunca los envía a ningún servidor.";
      panel.appendChild(warn);
    }

    const grid = document.createElement("div");
    grid.className = "field-grid";

    section.fields.forEach(f => {
      const div = document.createElement("div");
      div.className = "field" + (f.full ? " full" : "");
      const label = document.createElement("label");
      label.textContent = f.label + (f.restart ? " ⟳" : "");
      const input = document.createElement("input");
      input.type = f.password ? "password" : "text";
      input.id = "field-" + f.key;
      input.value = envValues[f.key] || "";
      if (f.key === "PAPER_TRADING") {
        input.addEventListener("input", () => updateModeBadge(input.value));
      }
      div.appendChild(label);
      div.appendChild(input);
      if (f.help) {
        const help = document.createElement("div");
        help.className = "help";
        help.textContent = f.help;
        div.appendChild(help);
      }
      grid.appendChild(div);
    });

    panel.appendChild(grid);
    content.appendChild(panel);
  });

  // Tab fijo de Terminal, al final, fuera del schema de campos.
  const termIndex = SCHEMA.length;
  const termBtn = document.createElement("button");
  termBtn.className = "tab-btn";
  termBtn.textContent = "[ Terminal ]";
  termBtn.onclick = () => selectTab(termIndex);
  sidebar.appendChild(termBtn);

  const termPanel = document.createElement("div");
  termPanel.className = "tab-panel";
  termPanel.id = "panel-" + termIndex;
  termPanel.innerHTML = `
    <div id="terminal-panel">
      <div id="terminal-banner">SHAWA <span>PUMP</span></div>
      <div id="terminal-toolbar">
        <button onclick="clearTerminal()">Limpiar</button>
      </div>
      <div id="terminal-output"><span class="placeholder">Esperando salida del bot… iniciá el bot para ver el log en vivo acá.</span></div>
    </div>
  `;
  content.appendChild(termPanel);
}

function selectTab(i) {
  document.querySelectorAll(".tab-btn").forEach((b, idx) => b.classList.toggle("active", idx === i));
  document.querySelectorAll(".tab-panel").forEach((p, idx) => p.classList.toggle("active", idx === i));
}

async function saveAll() {
  const updates = {};
  SCHEMA.forEach(section => {
    section.fields.forEach(f => {
      const input = document.getElementById("field-" + f.key);
      updates[f.key] = input.value;
    });
  });
  await invoke("write_env_file", { path: settings.env_path, updates });
  await restartBot();
  const fb = document.getElementById("save-feedback");
  fb.textContent = "Guardado — bot reiniciado.";
  setTimeout(() => fb.textContent = "", 3000);
}

async function startBot() {
  try { await invoke("start_bot", { exePath: settings.bot_exe_path }); }
  catch (e) { alert(e); }
  refreshStatus();
}
async function stopBot() {
  await invoke("stop_bot");
  refreshStatus();
}
async function restartBot() {
  try { await invoke("restart_bot", { exePath: settings.bot_exe_path }); }
  catch (e) { alert(e); }
  refreshStatus();
}

async function refreshStatus() {
  const running = await invoke("bot_status");
  document.getElementById("status-dot").classList.toggle("running", running);
  document.getElementById("status-text").textContent = running ? "Bot corriendo" : "Bot detenido";
}

function startStatusPolling() {
  refreshStatus();
  if (statusInterval) clearInterval(statusInterval);
  statusInterval = setInterval(refreshStatus, 2000);
}

init();
</script>
</body>
</html>
